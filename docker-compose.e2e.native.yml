# Swaps the e2e stack's BFF for the GraalVM native image. Build the binary first, then:
#
#   (cd consumer && ./gradlew -Pnative nativeCompile)
#   docker compose -f docker-compose.e2e.yml -f docker-compose.e2e.native.yml up -d --build --wait
#
# consumer/compose.native.yaml does the same for the backend-only stack. It cannot be layered onto
# this file directly: Compose resolves an override's relative paths against the first file's
# directory, which here is the repository root rather than consumer/.
services:
  bff:
    build: !override
      context: ./consumer
      dockerfile: Dockerfile.native
    environment:
      # The native binary does not read JAVA_TOOL_OPTIONS, and the JaCoCo agent cannot attach to it.
      JAVA_TOOL_OPTIONS: ""
    volumes: !override
      - ./consumer/dev-jwt-key.pem:/etc/bff/jwt-key.pem:ro
